[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lammps-jax"
version = "0.1.0"
description = "CUDA-first LAMMPS/Kokkos plugin support for exported JAX models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "jax>=0.8",
  "jaxlib>=0.8",
]

[project.optional-dependencies]
dist = [
  "ase>=3.22",
  "e3nn-jax>=0.20",
  "jax-md>=0.2.27",
  "nequix>=0.4",
]
test = [
  "pytest>=7",
  "numpy>=1.24",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["python", "tests"]

[tool.ty.environment]
python = "./.venv"
root = ["python", "tests"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unsupported-operator = "ignore"
